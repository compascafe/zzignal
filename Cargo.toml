[package]
name        = "polymarket-backend"
version     = "0.1.0"
edition     = "2021"
rust-version = "1.91"   # MSRV
default-run = "polymarket-backend"

[dependencies]
tokio = { version = "1", features = ["full"] }

polymarket-client-sdk = { version = "0.4", features = ["clob", "gamma", "rtds"] }

alloy = { version = "1.8", default-features = false, features = [
    "signer-local",
    "signers",
] }

tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }

serde      = { version = "1", features = ["derive"] }
serde_json = "1"

chrono = { version = "0.4", features = ["serde"] }

futures-util = "0.3"

anyhow = "1"

tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }

dotenvy = "0.15"

secrecy = { version = "0.10", features = ["serde"] }

# API REST + WebSocket server
axum       = { version = "0.8", features = ["ws", "macros"] }
tower-http = { version = "0.6", features = ["cors"] }

# Base de datos PostgreSQL
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio", "chrono"] }

[[bin]]
name = "polymarket-backend"
path = "src/main.rs"

[[bin]]
name = "setup"
path = "src/setup.rs"

[profile.release]
opt-level     = 2
lto           = false
codegen-units = 16
strip         = true
panic         = "abort"

[profile.dev]
opt-level = 1
